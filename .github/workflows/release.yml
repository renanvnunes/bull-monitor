# Gera os instaladores para Linux (x64 e ARM64), Windows e macOS (Apple Silicon e Intel).
#
# - Tag `v*` (ex.: v0.3.0): publica uma release no GitHub com todos os instaladores. Cada build
#   anexa os seus a um rascunho, e o rascunho só vira público se os cinco passarem; com qualquer
#   falha ele continua rascunho, invisível para quem não tem acesso ao repositório. A tag precisa
#   bater com a versão do src-tauri/tauri.conf.json.
# - Manual (aba Actions → Release → Run workflow): só gera os instaladores, como artefatos do run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nada por padrão; cada job pede só o que usa.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions de terceiros fixadas pelo hash do commit, que não muda como uma tag pode mudar. O
# comentário diz a versão; para atualizar, troque o hash pelo da versão nova.
jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag igual à versão do app
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com a versão ${version} do tauri.conf.json."
            exit 1
          fi

  build:
    needs: check-version
    # Também roda sem tag (manual), quando o check-version é pulado.
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    # Escrita para criar o rascunho da release e anexar os instaladores.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # O beforeBuildCommand chama `bash scripts/build-sidecar.sh`; sem isto, o `bash` do PATH no
      # Windows pode ser o do WSL, que não existe no runner.
      - name: Bash do Git no PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\Program Files\Git\bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      # CLI do Tauri. O sidecar instala as dependências dele no beforeBuildCommand.
      - run: bun install --frozen-lockfile

      - name: Build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          args: --target ${{ matrix.target }}
          # Com tag: anexa os instaladores ao rascunho; o job publish o torna público no fim.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Bull Monitor ${{ github.ref_name }}
          releaseDraft: true

      - name: Artefatos (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bull-monitor-${{ matrix.target }}
          # Só os instaladores; as pastas de trabalho do bundler (AppDir etc.) ficam de fora.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Só roda se todos os builds da matriz passarem: um único que falhe marca o job build como falho
  # e este é pulado, deixando a release como rascunho.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
