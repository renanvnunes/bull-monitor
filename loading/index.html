<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bull Monitor</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #667085; }
      @media (prefers-color-scheme: dark) { body { background: #12151b; color: #98a2b3; } }
      .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div><div class="spinner"></div>Iniciando…</div>
  </body>
</html>
